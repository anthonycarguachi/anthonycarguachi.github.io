<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora de Subredes</title>

<style>

body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#021402,#063d06);
    color:#ffffff;
}

.navbar{
    background:#000;
    padding:15px;
    text-align:center;
    border-bottom:3px solid #00ff66;
}

.navbar h1{
    margin:0;
    color:#ffffff;
    font-size:26px;
}

.navbar small{
    color:#ffffff;
}

.main{
    width:95%;
    margin:20px auto;
}

.card{
    background:#001a00;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 15px #00ff66;
}

.ip-inputs{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.ip-inputs input{
    width:70px;
    padding:8px;
    background:#ffffff;
    border:none;
    color:#000000;
    text-align:center;
    font-weight:bold;
}

button{
    padding:10px 15px;
    margin:10px 5px;
    border:none;
    border-radius:6px;
    background:#01531c;
    color:#ffffff;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#00ff66;
    transform:scale(1.05);
}

.clases{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.clases button{
    background:#002200;
    color:#00ff66;
    border:2px solid #00ff66;
}

.clases button:hover{
    background:#00ff66;
    color:#000;
}

.grid-listas{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.lista-box{
    background:#000d00;
    padding:15px;
    border-radius:8px;
    text-align:center;
    border:1px solid #00ff66;
}

.lista-box h3{
    color:#00ff66;
}

.lista-box select{
    width:100%;
    height:160px;
    background:#001a00;
    color:#00ff66;
    border:none;
}

.rango{
    text-align:center;
    font-size:18px;
    margin-top:10px;
}

.footer{
    text-align:center;
    margin-top:30px;
    font-size:13px;
    color:#66ff99;
}

</style>
</head>

<body>

<div class="navbar">
    <h1>GENERADOR DE SUBREDES IP</h1>
    <small>Unidad Educativa "Hispano América"</small>
</div>

<div class="main">

<!-- CLASES -->
<div class="card">
    <h2 style="text-align:center;">Seleccionar Clase</h2>
    <div class="clases">
        <button id="cmdclaseA" onclick="cmdclaseA_Click()">Clase A</button>
        <button id="cmdclaseB" onclick="cmdclaseB_Click()">Clase B</button>
        <button id="cmdclaseC" onclick="cmdclaseC_Click()">Clase C</button>
    </div>

    <div class="rango">      
        <strong>Desde:</strong> <span id="lbldesde"></span>
        &nbsp;&nbsp;
        <strong>Hasta:</strong> <span id="lblhasta"></span>
    </div>
</div>

<!-- INGRESO IP -->
<div class="card">
    <h2 style="text-align:center;">Ingresar Dirección IP</h2>

    <div class="ip-inputs">
        <input type="number" id="txtoct1"> .
        <input type="number" id="txtoct2"> .
        <input type="number" id="txtoct3"> .
        <input type="number" id="txtoct4">
    </div>

    <div style="text-align:center;">
        <button id="cmdverificar" onclick="verificarIP()">Verificar IP</button>
    </div>

    <div style="text-align:center; margin-top:15px;">
        Número de subredes:
        <input type="number" id="txtsub" style="width:80px;">
    </div>

    <div style="text-align:center; margin-top:20px;">
        <button id="cmdgenerar" onclick="cmdgenerar_Click()">Generar</button>
        <button id="cmdborrar" onclick="borrar()">Borrar</button>
        <button onclick="window.close()">Salir</button>
    </div>
</div>

<!-- RESULTADOS -->
<div class="card">
    <h2 style="text-align:center;">Resultados de Subred</h2>

    <div class="grid-listas">

        <div class="lista-box">
            <h3>Número</h3>
            <select id="listIP" multiple></select>
        </div>

        <div class="lista-box">
            <h3>Subred</h3>
            <select id="listdireccionip" multiple></select>
        </div>

        <div class="lista-box">
            <h3>Primera IP</h3>
            <select id="listMS" multiple></select>
        </div>

        <div class="lista-box">
            <h3>Última IP</h3>
            <select id="listPE" multiple></select>
        </div>

        <div class="lista-box">
            <h3>Broadcast</h3>
            <select id="listbro" multiple></select>
        </div>

    </div>
</div>

</div>

<div class="footer">
    
</div>

<!-- SCRIPT SOLO AQUÍ -->
<script src="script.js"></script>

</body>
</html>
